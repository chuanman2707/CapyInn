openapi: '3.1.0'
info:
  title: CapyInn MCP Gateway
  version: '0.1.0'
  description: |
    CapyInn MCP Gateway API.
    Exposes room management, booking, pricing, and reservation tools via MCP protocol.
    All dates use YYYY-MM-DD format. Timezone: Asia/Ho_Chi_Minh.
    Loopback-only by default. The documented server URL uses 127.0.0.1 and is not a LAN or remote deployment instruction.
    SQLite-backed PMS tools are the source of truth for booking, payment, room availability, folio, invoice, ledger, and audit state.
    Observer events are committed PMS facts that tell clients what to refresh; they are not a replacement for detail reads.
    Agent memory is non-authoritative and may only store preferences, summaries, service context, city recommendations, chat IDs, channel IDs, and notes.
    LAN or remote exposure requires explicit configuration, auth or pairing, and policy gates. High-risk write tools remain policy-gated even for paired clients.
  contact:
    name: CapyInn
servers:
  - url: http://127.0.0.1:{port}
    description: Local loopback MCP Gateway (runtime port; not LAN or remote)
    variables:
      port:
        default: '61234'
        description: Gateway port shown in the CapyInn settings UI

x-agent-safety:
  read_only_not_guest_safe: true
  data_sensitivity_classes:
    - PublicHotelInfo
    - GuestScoped
    - StaffOperational
    - CeoSensitive
  cloud_data_opt_in:
    statement: CEO cloud-data opt-in is persisted and revocable before CEO-sensitive PMS data can be sent to a cloud LLM.
    setting_key: ceo_cloud_data_opt_in
    default: false
  retention:
    raw_prompt_retention: not_stored
    raw_response_retention: not_stored
    raw_tool_output_retention: not_stored
    raw_provider_error_retention: not_stored
    session_policy: metadata_only_v1

paths:
  /mcp:
    post:
      summary: MCP Streamable HTTP Endpoint
      description: Send JSON-RPC requests to interact with MCP tools
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JsonRpcRequest'
      responses:
        '200':
          description: JSON-RPC response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonRpcResponse'

  /health:
    get:
      summary: Health Check
      responses:
        '200':
          description: Gateway is running
          content:
            text/plain:
              schema:
                type: string
                example: OK

  /observer/events:
    get:
      summary: PMS Observer Event Stream
      description: |
        Read-only Server-Sent Events stream for committed PMS outbox facts.
        No cursor starts after the current latest event.
        last_event_id replays events after the cursor, then streams new events.
        Payloads are observer-safe facts, not commands.
      security:
        - BearerAuth: []
      parameters:
        - name: last_event_id
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
          description: Replay events after this observer cursor before streaming new events.
      responses:
        '200':
          description: Observer event stream
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          description: Invalid cursor
        '401':
          description: Missing or invalid API key
        '409':
          description: Cursor expired; rebuild snapshot
        '500':
          description: Observer unavailable

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer

  schemas:
    JsonRpcRequest:
      type: object
      required: [jsonrpc, method, id]
      properties:
        jsonrpc:
          type: string
          enum: ['2.0']
        method:
          type: string
          description: 'MCP method: tools/list, tools/call, etc.'
        id:
          oneOf:
            - type: string
            - type: integer
        params:
          type: object

    JsonRpcResponse:
      type: object
      properties:
        jsonrpc:
          type: string
        id:
          oneOf:
            - type: string
            - type: integer
        result:
          type: object
        error:
          type: object

    # ─── Tool Input Schemas ───

    CheckAvailabilityInput:
      type: object
      required: [room_id, from_date, to_date]
      properties:
        room_id:
          type: string
          description: Room ID to check
        from_date:
          type: string
          format: date
          description: Start date (YYYY-MM-DD)
        to_date:
          type: string
          format: date
          description: End date (YYYY-MM-DD)

    GetRoomDetailInput:
      type: object
      required: [room_id]
      properties:
        room_id:
          type: string

    GetBookingsInput:
      type: object
      properties:
        status:
          type: string
          enum: [active, booked, completed, cancelled]
        from:
          type: string
          format: date
        to:
          type: string
          format: date

    GetSettingsInput:
      type: object
      required: [key]
      properties:
        key:
          type: string
          description: 'Setting key: hotel_name, hotel_address, hotel_phone, hotel_rules'

    CalculatePriceInput:
      type: object
      required: [room_type, check_in, check_out, pricing_type]
      properties:
        room_type:
          type: string
        check_in:
          type: string
          format: date-time
        check_out:
          type: string
          format: date-time
        pricing_type:
          type: string
          enum: [nightly, hourly, overnight, daily]

    GetInvoiceInput:
      type: object
      required: [booking_id]
      properties:
        booking_id:
          type: string

    CreateReservationInput:
      type: object
      required: [room_id, guest_name, guest_phone, check_in_date, check_out_date, nights]
      properties:
        room_id:
          type: string
        guest_name:
          type: string
        guest_phone:
          type: string
        guest_doc_number:
          type: string
          nullable: true
        check_in_date:
          type: string
          format: date
        check_out_date:
          type: string
          format: date
        nights:
          type: integer
          minimum: 1
        deposit_amount:
          type: number
          nullable: true
        source:
          type: string
          nullable: true
          default: ai-agent
        notes:
          type: string
          nullable: true

    CancelReservationInput:
      type: object
      required: [booking_id]
      properties:
        booking_id:
          type: string

    ModifyReservationInput:
      type: object
      required: [booking_id, new_check_in_date, new_check_out_date, new_nights]
      properties:
        booking_id:
          type: string
        new_check_in_date:
          type: string
          format: date
        new_check_out_date:
          type: string
          format: date
        new_nights:
          type: integer
          minimum: 1
